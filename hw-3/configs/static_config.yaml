components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 2
  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stdout'
          level: info
          overflow_behavior: discard

    tracer:
      service-name: warehouse-inventory-api

    dynamic-config:
      defaults: {}

    dns-client:
      fs-task-processor: fs-task-processor

    testsuite-support: {}

    warehouse-database:
      dbconnection#env: POSTGRESQL
      dbconnection#fallback: 'postgresql://warehouse_user:warehouse_password@postgres:5432/warehouse_inventory'
      blocking_task_processor: fs-task-processor
      dns_resolver: async

    handler-implicit-http-options:
      as_fallback: implicit-http-options
      method: OPTIONS
      task_processor: main-task-processor

    warehouse-storage: {}

    handler-auth-register:
      path: /api/v1/auth/register
      method: POST
      task_processor: main-task-processor

    handler-auth-login:
      path: /api/v1/auth/login
      method: POST
      task_processor: main-task-processor

    handler-create-user:
      path: /api/v1/users
      method: POST
      task_processor: main-task-processor

    handler-search-users:
      path: /api/v1/users
      method: GET
      task_processor: main-task-processor

    handler-create-product:
      path: /api/v1/products
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - bearer

    handler-search-products:
      path: /api/v1/products
      method: GET
      task_processor: main-task-processor

    handler-stock-balances:
      path: /api/v1/stock-balances
      method: GET
      task_processor: main-task-processor

    handler-create-receipt:
      path: /api/v1/receipts
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - bearer

    handler-list-receipts:
      path: /api/v1/receipts
      method: GET
      task_processor: main-task-processor

    handler-create-write-off:
      path: /api/v1/write-offs
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - bearer
